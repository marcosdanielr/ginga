name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin: ginga
            artifact: ginga-linux
          - os: windows-latest
            bin: ginga.exe
            artifact: ginga-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --manifest-path injector/Cargo.toml
      - name: Checksum
        shell: bash
        run: |
          cd injector/target/release
          sha256sum "${{ matrix.bin }}" | cut -d' ' -f1 | tee "${{ matrix.bin }}.sha256"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            injector/target/release/${{ matrix.bin }}
            injector/target/release/${{ matrix.bin }}.sha256
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            injector/target/release/${{ matrix.bin }}
            injector/target/release/${{ matrix.bin }}.sha256
